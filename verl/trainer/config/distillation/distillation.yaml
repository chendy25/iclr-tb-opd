# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.DistillationConfig

# specify the default per-component configs
defaults:

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>

  # load the default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# Whether to enable distillation.
enabled: false

# distillation loss config
distillation_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationLossConfig


  # Loss function mode for distillation
  loss_mode: k3

  # If distillation loss requires top-k logits, this is the value of k
  topk: 32

  # Whether to include task rewards alongside distillation loss.
  use_task_rewards: true


  # The coef of the distillation loss when use_task_rewards is true
  distillation_loss_coef: 1.0

  # Optional max clamp value for distillation loss. If null, no clamping is applied.
  loss_max_clamp: null

  # Optional min clamp value for log probabilities for stability, e.g., log q - log p where p or q are very close to zero.
  log_prob_min_clamp: null

  # Whether to incorporate distillation loss as a reward.
  use_policy_gradient: false

  # Name of the policy loss to use when use_policy_gradient is true.
  policy_loss_mode: "vanilla"

  # PPO clipping ratio for policy loss.
  clip_ratio: 0.2

  # Lower bound for PPO clipping ratio.
  clip_ratio_low: 0.2 

  # Upper bound for PPO clipping ratio.
  clip_ratio_high: 0.2

  # DAPO-style soft overlong punishment applied to the token-level advantage
  # (reward-free OPD has no reward channel). Disabled by default.
  overlong_enable: false

  # Length (response tokens) of the soft ramp before the hard cap.
  overlong_buffer_len: 4096

  # Peak penalty magnitude at/above the cap (DAPO uses 1.0; OPD adv ~O(0.1)).
  overlong_penalty_factor: 1.0

  # Hard cap = max response length. If null, inferred from response_mask.shape[-1].
  overlong_max_len: null

  # Weight of the auxiliary "emit EOS after the answer" cross-entropy. Active only when
  # the rollout emits an eos_sft_mask (rollout.learn_eos_after_answer). 0.0 disables.
  learn_eos_coef: 0.0


# Number of GPUs per node in the distillation teacher resource pool
n_gpus_per_node: 8

# Number of nodes in the distillation teacher resource pool
nnodes: 0

# multi-teacher configs
teacher_models:

  # Single-teacher config. This entry is popped when other teacher entries are added, so
  # using `teacher_model` as one of several keys silently drops it. For
  # example, the following CLI overrides result in ONLY `teacher_model2` being used:
  #
  # distillation.teacher_models.teacher_model.key=openai/gsm8k
  # distillation.teacher_models.teacher_model.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  #
  # Instead, give the first teacher a different name:
  #
  # +distillation.teacher_models.teacher_model1.key=openai/gsm8k
  # +distillation.teacher_models.teacher_model1.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  teacher_model:
    _target_: verl.workers.config.DistillationTeacherModelConfig
    key: null
    model_path: null
    num_replicas: 0
    inference:
      _target_: verl.workers.config.RolloutConfig
      name: ${oc.select:actor_rollout_ref.rollout.name}
      dtype: ${oc.select:actor_rollout_ref.rollout.dtype}
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 2
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: true
      prompt_length: ${oc.select:actor_rollout_ref.rollout.prompt_length}
      response_length: ${oc.select:actor_rollout_ref.rollout.response_length}
      temperature: ${oc.select:actor_rollout_ref.rollout.temperature}

# Key to route examples to the appropriate teacher model in multi-teacher setups. Should correspond to a field in the data proto, e.g., task.
teacher_key: data_source

# Token-level branching OPD (TB-OPD). Disabled by default -> standard OPD (B1) unaffected.
tb_opd:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.TBOPDConfig

  # Master switch for token-level branching.
  enable: false

  # Number of alternative tokens expanded into full branch continuations (rollout.n should be 1 + k).
  k: 2

  # Only branch when the main trajectory is judged incorrect; otherwise fill extra slots with plain rollouts.
  only_fail: true

  # Fork uncertainty metric: "entropy" (truncated top-k entropy) or "topk_gap" (top1-top2 margin).
  fork_metric: entropy

  # Number of top-k prompt logprobs requested in the second student forward.
  topk_logprobs: 20

  # Minimum remaining response budget required at a fork position.
  branch_min_tokens: 8

  # Reward score >= threshold counts the main trajectory as correct.
  correct_threshold: 1.0

  # Fork-position selection among filtered candidates: "argmax" or "topk_uniform".
  fork_select: argmax

  # Number of most-uncertain positions kept before uniform sampling (topk_uniform only).
  fork_topk_positions: 20

  # Number of leading response positions to exclude from forking (CURE skips position 0).
  fork_skip_first: 1

  # Skip a candidate unless its decoded token, stripped of whitespace, is longer than this.
  fork_min_token_strip_len: 1

  # Minimum fork uncertainty (entropy metric only); below this no fork is emitted. 0 disables.
  fork_min_entropy: 0.0

  # Exclude the main-sampled token from the expanded candidate set.
  fork_dedup_main: true

  # Fork-position eligibility filter: "math_aware" (keep digits/operators + words,
  # drop only special/whitespace/pure-punctuation) or "strip_len" (legacy CURE).
  fork_token_filter: math_aware

  # Scheme B: read fork candidates from the main rollout's own top-k logprobs
  # (logprobs=topk_logprobs) instead of a second student forward.
  scheme_b: false

  # Validation only: also run the legacy second forward and log fork-position
  # agreement (tb_opd_schemeb_pos_match). Doubles selection cost; keep off.
  scheme_b_validate: false

  # Branch continuation mode: forced_topk (M*) or resample (B4 / CURE-style).
  branch_mode: forced_topk

  # Sampling temperature for resample branches; <0 reuses rollout.temperature.
  resample_temperature: -1.0

  # Apply the same post-generation answer shaping to branch continuations as the
  # main rollout (mask_truncated_no_answer / mask_after_answer / learn-EOS +
  # rep_penalty / format_penalty). Off -> branches keep full mask, no EOS/penalty.
  shape_branches: false